<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kling Clone - Génération vidéo IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="url(#grad)"/>
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <polygon points="13,10 13,22 23,16" fill="white"/>
      </svg>
      <span>Kling Clone</span>
    </div>
    <div class="nav-links">
      <a href="#" class="active">Créer</a>
      <a href="#history">Historique</a>
    </div>
  </header>

  <main class="container">
    <div class="generator-panel">
      <h1 class="title">Transformez vos idées en vidéos</h1>
      <p class="subtitle">Décrivez votre vision, l'IA la rend réalité</p>

      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="std">🎬 Standard <small>5s</small></button>
        <button class="mode-btn" data-mode="pro">✨ Pro <small>10s</small></button>
      </div>

      <div class="input-section">
        <div class="image-upload" id="imageUpload">
          <input type="file" id="imageInput" accept="image/*" hidden>
          <div class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-icon">📷</span>
            <span>Ajouter une image<br><small>Optionnel</small></span>
          </div>
          <img id="imagePreview" style="display:none">
        </div>

        <div class="prompt-area">
          <textarea id="promptInput" placeholder="Décrivez votre vidéo... (ex: Un chat astronaute flottant dans l'espace, style cinématique)" maxlength="500"></textarea>
          <div class="prompt-footer">
            <span id="charCount">0 / 500</span>
          </div>
        </div>
      </div>

      <div class="advanced-options">
        <div class="option-group">
          <label>Format</label>
          <select id="aspectRatio">
            <option value="16:9">16:9 (Paysage)</option>
            <option value="9:16">9:16 (Portrait)</option>
            <option value="1:1">1:1 (Carré)</option>
          </select>
        </div>
        <div class="option-group">
          <label>Durée</label>
          <select id="duration">
            <option value="5">5 secondes</option>
            <option value="10">10 secondes</option>
          </select>
        </div>
        <div class="option-group">
          <label>Prompt négatif</label>
          <input type="text" id="negativePrompt" placeholder="Ce qu'il faut éviter...">
        </div>
      </div>

      <button class="btn-generate" id="generateBtn">
        <span>✨ Générer la vidéo</span>
      </button>

      <div class="progress-panel" id="progressPanel" style="display:none">
        <div class="progress-header">
          <span>Génération en cours...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-hint">⏱️ Cela prend généralement 1-2 minutes</p>
      </div>

      <div class="result-panel" id="resultPanel" style="display:none">
        <video id="resultVideo" controls playsinline></video>
        <div class="result-actions">
          <button class="btn-action" id="downloadBtn">⬇️ Télécharger</button>
          <button class="btn-action" id="regenerateBtn">🔄 Régénérer</button>
        </div>
      </div>
    </div>

    <section class="history-section" id="history">
      <h2>Historique</h2>
      <div class="history-grid" id="historyGrid">
        <p class="empty-state">Aucune génération pour l'instant</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
